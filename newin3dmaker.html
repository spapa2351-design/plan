<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴인 작업용 -CJ대한통운 3D 캐릭터 제너레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite;
            display: inline-block; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-10">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-[800px] overflow-hidden relative">

        <!-- API 키 설정 모달 -->
        <div id="api-modal" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm z-50 p-8 flex flex-col justify-center">
            <h3 class="text-xl font-bold mb-2">⚙️ Gemini API 키 설정</h3>
            <p class="text-sm text-gray-600 mb-4">Google AI Studio에서 발급받은 API 키를 입력해주세요. 키는 이 PC의 브라우저에만 저장됩니다.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <label class="text-sm font-semibold text-gray-700 mb-1 block">품질 모드</label>
            <select id="quality-select" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg mb-4 text-sm">
                <option value="1k">표준 1K — 1024px (기본, 저렴·빠름)</option>
                <option value="2k">고품질 2K — 2048px (인쇄·대형 그래픽용)</option>
            </select>
            <div class="flex space-x-3">
                <button id="save-key-btn" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">저장하기</button>
                <button id="close-modal-btn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-bold hover:bg-gray-300">닫기</button>
            </div>
        </div>

        <!-- 헤더 -->
        <div class="bg-blue-600 p-6 text-white text-center relative">
            <button id="settings-btn" class="absolute top-4 right-4 text-blue-200 hover:text-white transition-colors" title="API·품질 설정">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <h1 class="text-2xl font-bold tracking-tight">📦 3D 캐릭터 제너레이터 v5</h1>
            <p class="text-blue-100 text-sm mt-2">세트를 고르고, 일관된 3D 이미지를 생성하세요.</p>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            <!-- ◀ 좌측: 옵션 폼 -->
            <div>
            <form id="generator-form" class="space-y-6">

                <!-- 1. 세트 선택 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">캐릭터 세트</label>
                    <div id="template-grid" class="grid grid-cols-3 gap-2"></div>
                </div>

                <!-- 2. 대상 선택 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">생성 대상</label>
                    <div class="grid grid-cols-3 gap-1 bg-gray-100 p-1 rounded-lg" id="subject-group">
                        <label class="cursor-pointer">
                            <input type="radio" name="subject" value="char" checked class="peer hidden">
                            <div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">🧍 캐릭터</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="subject" value="vehicle" class="peer hidden">
                            <div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">🚚 차량</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="subject" value="both" class="peer hidden">
                            <div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">🧍🚚 둘 다</div>
                        </label>
                    </div>
                </div>

                <!-- 3. 상황 프리셋 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">상황 프리셋 <span class="text-gray-400 font-normal">(클릭하면 아래 항목이 자동 입력됩니다)</span></label>
                    <div id="preset-chips" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- 4. 모션 -->
                <div>
                    <label for="motion" class="block text-sm font-semibold text-gray-700 mb-2">모션·상황 설명</label>
                    <input type="text" id="motion" name="motion" placeholder="예: 택배 박스를 들고 계단을 오르는 모습" required
                           class="block w-full bg-gray-50 border border-gray-300 text-gray-700 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
                </div>

                <!-- 5. 캐릭터 옵션 (차량 단독일 때 숨김) -->
                <div id="char-options" class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="expression" class="block text-sm font-semibold text-gray-700 mb-2">표정</label>
                        <select id="expression" class="block w-full bg-gray-50 border border-gray-300 text-gray-700 py-3 px-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="friendly smile">😊 미소 (기본)</option>
                            <option value="serious and focused">😐 진지·집중</option>
                            <option value="shocked and panicked, wide eyes, open mouth">😱 놀람·당황</option>
                            <option value="worried and troubled">😟 걱정·난처</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">모자(캡)</label>
                        <div class="flex space-x-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="cap" value="on" checked class="form-radio h-4 w-4 text-blue-600">
                                <span class="ml-2 text-gray-700 text-sm">착용</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="cap" value="off" class="form-radio h-4 w-4 text-blue-600">
                                <span class="ml-2 text-gray-700 text-sm">안함</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 6. 카메라 앵글 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">카메라 앵글</label>
                    <div class="grid grid-cols-3 gap-1 bg-gray-100 p-1 rounded-lg">
                        <label class="cursor-pointer"><input type="radio" name="angle" value="quarter" checked class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">↗ 쿼터뷰</div></label>
                        <label class="cursor-pointer"><input type="radio" name="angle" value="front" class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">⬆ 정면</div></label>
                        <label class="cursor-pointer"><input type="radio" name="angle" value="side" class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">➡ 측면</div></label>
                    </div>
                </div>

                <!-- 7. 이미지 비율 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">이미지 비율</label>
                    <div class="grid grid-cols-4 gap-1 bg-gray-100 p-1 rounded-lg">
                        <label class="cursor-pointer"><input type="radio" name="ratio" value="1:1" checked class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">1:1</div></label>
                        <label class="cursor-pointer"><input type="radio" name="ratio" value="3:4" class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">3:4</div></label>
                        <label class="cursor-pointer"><input type="radio" name="ratio" value="4:3" class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">4:3</div></label>
                        <label class="cursor-pointer"><input type="radio" name="ratio" value="16:9" class="peer hidden"><div class="text-center text-sm py-2 rounded-md peer-checked:bg-white peer-checked:shadow peer-checked:font-bold text-gray-600 peer-checked:text-blue-700 transition-all">16:9</div></label>
                    </div>
                </div>

                <!-- 8. 추가 지시 -->
                <div>
                    <label for="extra" class="block text-sm font-semibold text-gray-700 mb-2">추가 지시 <span class="text-gray-400 font-normal">(선택)</span></label>
                    <input type="text" id="extra" name="extra" placeholder="예: 소품으로 태블릿 추가, 살짝 로우앵글"
                           class="block w-full bg-gray-50 border border-gray-300 text-gray-700 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all duration-200 flex justify-center items-center">
                    <span id="btn-text">이미지 생성하기</span>
                    <span id="loader" class="loader ml-2 hidden"></span>
                </button>
            </form>

            <div id="error-msg" class="hidden mt-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg border border-red-200"></div>
            </div>

            <!-- ▶ 우측: 결과 패널 (상시 표시) -->
            <div class="md:sticky md:top-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">결과</label>

                <!-- 결과 대기 상태 -->
                <div id="empty-state" class="flex flex-col items-center justify-center h-80 rounded-lg border-2 border-dashed border-gray-200 text-gray-300">
                    <span class="text-4xl mb-2">🖼</span>
                    <span class="text-sm font-semibold">생성된 이미지가 여기에 표시됩니다</span>
                </div>

                <!-- 결과 -->
                <div id="result-area" class="hidden">
                    <div class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-gray-300 bg-white">
                        <img id="generated-image" src="" alt="생성 결과" class="max-h-96 object-contain rounded-md mb-2">
                        <p id="result-info" class="text-[11px] text-gray-400 mb-3"></p>
                        <div class="w-full flex space-x-2">
                            <a id="download-btn" href="#" download="character.png" class="flex-1 text-center bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-3 rounded-lg shadow transition-colors text-sm">⬇ 다운로드</a>
                            <button id="copy-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-lg shadow transition-colors text-sm">📋 복사</button>
                            <button id="regen-btn" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg shadow transition-colors text-sm">🔄 다시</button>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-3 text-center">배경은 #FFFFFF로 자동 보정되어 저장됩니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // [세트 관리 영역] — 팀 공식 세트는 여기서만 관리합니다.
        //
        // 세트 추가 방법 (관리자):
        //  1) 캐릭터 레퍼런스 1~3장 + 차량 레퍼런스 0~2장을
        //     768px 이하 JPEG base64로 준비

        // ------------------------------------------------------------

        function getSelectedId() {
            const saved = localStorage.getItem(SELECTED_KEY);
            if (TEMPLATES.some(t => t.id === saved)) return saved;
            return TEMPLATES[0].id;
        }
        function getSelectedSet() {
            return TEMPLATES.find(t => t.id === getSelectedId());
        }
        function renderTemplateGrid() {
            const grid = document.getElementById('template-grid');
            const selectedId = getSelectedId();
            grid.innerHTML = '';
            TEMPLATES.forEach(t => {
                const isSelected = t.id === selectedId;
                const card = document.createElement('button');
                card.type = 'button';
                card.className = `relative rounded-lg border-2 p-2 flex flex-col items-center transition-all ${
                    isSelected ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-gray-200 bg-gray-50 hover:border-gray-300'

                const thumb = `data:${t.charRefs[0].mimeType};base64,${t.charRefs[0].data}`;
                card.innerHTML = `
                    <img src="${thumb}" class="h-12 w-12 object-contain bg-white rounded mb-1">
                    <span class="text-[10px] font-semibold ${isSelected ? 'text-blue-700' : 'text-gray-600'} text-center leading-tight">${t.name.replace(' · ', '<br>')}</span>

                `;
                card.onclick = () => { localStorage.setItem(SELECTED_KEY, t.id); renderTemplateGrid(); updateSubjectAvailability(); };
                grid.appendChild(card);

                grid.appendChild(placeholder);

                chip.className = 'text-xs bg-gray-100 hover:bg-blue-100 hover:text-blue-700 text-gray-600 font-semibold px-3 py-1.5 rounded-full border border-gray-200 transition-colors';
                chip.textContent = p.label;
                chip.onclick = () => {
                    const f = p.fill;
                    if (f.subject) {
                        document.querySelector(`input[name="subject"][value="${f.subject}"]`).checked = true;
                        updateCharOptionsVisibility();
                    }
                    if (f.motion) document.getElementById('motion').value = f.motion;
                    if (f.expression) document.getElementById('expression').value = f.expression;
                    document.getElementById('extra').value = f.extra || '';
                };
                wrap.appendChild(chip);
            });
        }

        // 차량 단독 선택 시 캐릭터 옵션 숨김
        function updateCharOptionsVisibility() {
            const subject = document.querySelector('input[name="subject"]:checked').value;
            document.getElementById('char-options').style.display = subject === 'vehicle' ? 'none' : 'grid';
        }
        document.getElementById('subject-group').addEventListener('change', updateCharOptionsVisibility);

        // 차량 레퍼런스가 없는 세트는 차량/둘다 옵션 비활성화
        function updateSubjectAvailability() {
            const hasVehicle = getSelectedSet().vehicleRefs.length > 0;
            ['vehicle', 'both'].forEach(v => {
                const input = document.querySelector(`input[name="subject"][value="${v}"]`);
                input.disabled = !hasVehicle;
                input.parentElement.style.opacity = hasVehicle ? '1' : '0.35';
                input.parentElement.style.pointerEvents = hasVehicle ? 'auto' : 'none';
            });
            if (!hasVehicle) {
                document.querySelector('input[name="subject"][value="char"]').checked = true;
                updateCharOptionsVisibility();
            }
        }

        // ------------------------------------------------------------
        // API 키 / 품질 설정
        // ------------------------------------------------------------
        const apiModal = document.getElementById('api-modal');
        document.getElementById('settings-btn').onclick = () => apiModal.classList.remove('hidden');
        document.getElementById('close-modal-btn').onclick = () => apiModal.classList.add('hidden');
        const apiKeyInput = document.getElementById('api-key-input');
        const qualitySelect = document.getElementById('quality-select');
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
            qualitySelect.value = localStorage.getItem(QUALITY_KEY) || '1k';
            renderTemplateGrid();
            renderPresets();
            updateCharOptionsVisibility();
            updateSubjectAvailability();
        });
        document.getElementById('save-key-btn').onclick = () => {
            const key = apiKeyInput.value.trim();
            if (!key) { alert('API 키를 입력해주세요.'); return; }
            localStorage.setItem('gemini_api_key', key);
            localStorage.setItem(QUALITY_KEY, qualitySelect.value);
            alert('설정이 저장되었습니다!');
            apiModal.classList.add('hidden');
        };

        // ------------------------------------------------------------
        // 배경 #FFFFFF 정규화
        // ------------------------------------------------------------
        // ------------------------------------------------------------
        // 배경 #FFFFFF 정규화 (해상도는 생성 원본 그대로 유지)
        // ------------------------------------------------------------
        function normalizeWhiteBg(imgDataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const d = imageData.data;
                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i], g = d[i+1], b = d[i+2];
                        const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
                        if (minC >= 240 && (maxC - minC) <= 6) {
                            d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = 255;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve({ url: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height });
                };
                img.src = imgDataUrl;
            });
        }

        // ------------------------------------------------------------
        // 이미지 생성
        //  - 고품질 2K: gemini-3-pro-image-preview (2048px, 레퍼런스 다중 지원)
        //  - 표준 1K : gemini-2.5-flash-image (1024px, 저렴)
        // ------------------------------------------------------------
        async function generate() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('먼저 우측 상단 ⚙️ 설정에서 API 키를 입력해주세요!');
                apiModal.classList.remove('hidden');
                return;
            }

            const set = getSelectedSet();
            const subject = document.querySelector('input[name="subject"]:checked').value;
            const motion = document.getElementById('motion').value;
            const extra = document.getElementById('extra').value.trim();
            const expression = document.getElementById('expression').value;
            const cap = document.querySelector('input[name="cap"]:checked').value;
            const ratio = document.querySelector('input[name="ratio"]:checked').value;
            const angle = document.querySelector('input[name="angle"]:checked').value;
            const quality = localStorage.getItem(QUALITY_KEY) || '1k';

            const ANGLE_PROMPTS = {
                quarter: 'Camera angle: three-quarter view at eye level, the same angle as the reference images.',
                front: 'Camera angle: straight frontal view at eye level, subject facing the camera directly.',
                side: 'Camera angle: full side profile view at eye level, subject seen from the side.'
            };

            // 대상에 맞는 레퍼런스 구성
            let refs = [];
            if (subject === 'char') refs = set.charRefs;
            else if (subject === 'vehicle') refs = set.vehicleRefs.length ? set.vehicleRefs : set.charRefs;
            else refs = [...set.charRefs, ...set.vehicleRefs];

            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');
            const submitBtn = document.getElementById('submit-btn');
            const resultArea = document.getElementById('result-area');
            const errorMsg = document.getElementById('error-msg');

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = "AI가 렌더링 중입니다...";
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            // 대상별 프롬프트 조립
            let subjectPrompt = '';
            if (subject === 'char') {
                subjectPrompt = `Show ONLY the character (no vehicle). Full body visible, single character only.
Facial expression: ${expression}.
${cap === 'on' ? 'The character IS wearing the same cap as in the references.' : 'The character is NOT wearing a cap; show natural short dark hair.'}`;
            } else if (subject === 'vehicle') {
                subjectPrompt = `Show ONLY the delivery truck (no people). The truck design, colors, logos and proportions must match the reference exactly.`;
            } else {
                subjectPrompt = `Show the character TOGETHER WITH the delivery truck in one scene. Both must match their references exactly.
Facial expression: ${expression}.
${cap === 'on' ? 'The character IS wearing the same cap as in the references.' : 'The character is NOT wearing a cap.'}`;
            }

            const finalPrompt = `${MASTER_STYLE}

New scene: ${motion}.
${subjectPrompt}
${ANGLE_PROMPTS[angle]}
${extra ? 'Additional instruction: ' + extra + '.' : ''}
Background must be a completely flat, solid, pure white color (#FFFFFF) with no gradient, no floor shadow, and no vignette.
Centered composition, high resolution 3D render.`;

            const model = quality === '2k' ? 'gemini-3-pro-image-preview' : 'gemini-2.5-flash-image';
            const generationConfig = quality === '2k'
                ? { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: ratio, imageSize: "2K" } }
                : { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: ratio } };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                ...refs.map(r => ({ inlineData: { mimeType: r.mimeType, data: r.data } })),
                                { text: finalPrompt }
                            ]
                        }],
                        generationConfig
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error?.message || "이미지 생성 중 오류가 발생했습니다.");
                }

                const imagePart = (data.candidates?.[0]?.content?.parts || []).find(p => p.inlineData);
                if (!imagePart) throw new Error("응답에 이미지가 없습니다. 프롬프트를 바꿔 다시 시도해주세요.");

                btnText.textContent = "배경 보정 중...";
                const rawUrl = `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;
                const { url: imageUrl, w, h } = await normalizeWhiteBg(rawUrl);

                document.getElementById('generated-image').src = imageUrl;
                document.getElementById('result-info').textContent = `${w} × ${h}px · ${model}`;
                const downloadBtn = document.getElementById('download-btn');
                downloadBtn.href = imageUrl;
                const safeMotion = motion.replace(/[^a-zA-Z0-9가-힣]/g, '_').substring(0, 15);
                downloadBtn.download = `${set.id}_${subject}_${safeMotion}.png`;

                resultArea.classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                errorMsg.textContent = `❌ 오류: ${error.message}`;
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = "이미지 생성하기";
                loader.classList.add('hidden');
            }
        }

        document.getElementById('generator-form').addEventListener('submit', (e) => {
            e.preventDefault();
            generate();
        });
        document.getElementById('regen-btn').addEventListener('click', generate);

        // ------------------------------------------------------------
        // 클립보드 복사 (피그마 등에 Ctrl+V로 바로 붙여넣기)
        // 주의: 클립보드 API는 https 또는 localhost에서만 동작합니다.
        // 로컬 file:// 로 열면 복사가 막힐 수 있으니 GitHub Pages 사용 권장.
        // ------------------------------------------------------------
        document.getElementById('copy-btn').addEventListener('click', async () => {
            const copyBtn = document.getElementById('copy-btn');
            const src = document.getElementById('generated-image').src;
            if (!src) return;
            try {
                const blob = await (await fetch(src)).blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                copyBtn.textContent = '✅ 복사됨!';
                setTimeout(() => { copyBtn.textContent = '📋 복사'; }, 1500);
            } catch (err) {
                alert('클립보드 복사에 실패했습니다. (https 환경에서만 동작합니다)\n대신 다운로드 버튼을 이용해주세요.');
            }
        });
    </script>
</body>
</html>
